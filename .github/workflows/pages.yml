name: Přesměrování starého náhledu (GitHub Pages → Netlify)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Náhled se přesunul na Netlify (https://nutrivero-nahled.netlify.app) kvůli Netlify Forms.
      # GitHub Pages už web nestaví, jen přesměrovává staré odkazy se zachováním cesty.
      # Původní sestavení pro GitHub Pages: python _src/build.py --target preview --out _dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
