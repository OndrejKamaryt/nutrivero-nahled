<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Náhled webu Nutrivero se přesunul</title>
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://nutrivero.cz/">
<meta http-equiv="refresh" content="0; url=https://nutrivero.cz/">
<script>
  // Zachová cestu: /nutrivero-nahled/cookies/ → https://nutrivero.cz/cookies/
  (function () {
    var p = location.pathname.replace(/^\/nutrivero-nahled/, '') || '/';
    location.replace('https://nutrivero.cz' + p + location.search + location.hash);
  })();
</script>
<style>body{margin:0;padding:48px 16px;font-family:system-ui,sans-serif;background:#F7F4EE;color:#254F44;text-align:center}a{color:#254F44}</style>
</head>
<body>
<p>Náhled webu Nutrivero se přesunul na <a href="https://nutrivero.cz/">nutrivero.cz</a>.</p>
</body>
</html>
